events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    server_tokens off;
    access_log /dev/stdout;
    error_log /dev/stdout;

    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   180;
    client_max_body_size 100M;
    types_hash_max_size 2048;
    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;

    # === DNS re-resolution (fixes the 2.4 min hang) ===
    resolver kube-dns.kube-system.svc.cluster.local valid=30s ipv6=off;
    resolver_timeout 5s;

    # === Timeouts: fail fast on dead upstreams ===
    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    proxy_read_timeout    300s;
    send_timeout          60s;

    index   index.html index.htm;

    server {
        listen       80 default_server;
        listen         [::]:80 default_server;
        client_max_body_size 100M;
        server_name  localhost;
        root         /var/www/html;

        # Proper CSP Header
        add_header Content-Security-Policy "default-src 'self' 'unsafe-eval' 'unsafe-inline' *.otsuka-us.com:* *.amazonaws.com *.compute.amazonaws.com:* *.elb.amazonaws.com:* *.gstatic.com *.googleusercontent.com *.googleapis.com cdnjs.cloudflare.com *.microsoft.com:* data: blob:; style-src 'self' 'unsafe-inline' cdnjs.cloudflare.com stackpath.bootstrapcdn.com; connect-src 'self' https://login.microsoftonline.com https://graph.microsoft.com *.otsuka-us.com:* *.amazonaws.com *.compute.amazonaws.com:* *.elb.amazonaws.com:*;" always;

        # ================= API =================
        location /api/ {
            set $api_upstream "api-aiwriter-services-dev.otsuka-us.com";

            # Compute the upstream path explicitly (variable-form proxy_pass
            # otherwise drops the part of the URI after /api/).
            rewrite ^/api/(.*)$ /ccm-processing-dev/public/api/$1 break;

            # NOTE: no path on proxy_pass — the rewritten URI is used.
            proxy_pass https://$api_upstream;

            proxy_http_version 1.1;
            proxy_ssl_server_name on;
            proxy_ssl_name $api_upstream;
            proxy_redirect off;

            proxy_set_header Host $api_upstream;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering on;
            proxy_buffer_size 16k;
            proxy_buffers 4 32k;
        }

        # ================= CCM Utils =================
        location /ccm-utils/ {
            set $utils_upstream "api-aiwriter-services-dev.otsuka-us.com";

            rewrite ^/ccm-utils/(.*)$ /ccm-utils/public/api/$1 break;

            proxy_pass https://$utils_upstream;

            proxy_http_version 1.1;
            proxy_ssl_server_name on;
            proxy_ssl_name $utils_upstream;
            proxy_redirect off;

            proxy_set_header Host $utils_upstream;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering on;
            proxy_buffer_size 16k;
            proxy_buffers 4 32k;
        }

        location / {
            root   /usr/share/nginx/html;
            index taskpane.html index.html index.htm;
            try_files $uri $uri/ /index.html =404;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }
    }
}
